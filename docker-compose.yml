services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pcelarstvo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pcelarstvo" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pcelarstvo
      JWT_SECRET: ${JWT_SECRET}
      API_URL: ${API_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-"false"}
    command: npm run start
    restart: unless-stopped

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pcelarstvo
    command: npm run db:migrate
    restart: "no"
    profiles: [ "ops" ]

  seed:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/pcelarstvo
    command: npm run db:seed
    restart: "no"
    profiles: [ "ops" ]

volumes:
  pgdata:
